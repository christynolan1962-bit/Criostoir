header h1{margin:0;font-size:34px}
header p{margin:8px 0 0}
main{max-width:700px;margin:25px auto;padding:15px
.card{background:white;padding:20px;margin:15px 0;border-radius:12px;box-shadow:0 2px 8px #bbb}

input{width:100%;padding:12px;box-sizing:border-box;border:1px solid #ccc;border-radius:8px;margin:6px 0}
.result{font-size:20px;font-weight:bold;margin-top:12px}

<body>

<header>
<h1>CRIÓSTOIR</h1>
<p>Simple Money & Trading Tools</p>
</header>

<main>

<h2>💰 Money Planner</h2>
<p>Plan your money simply and clearly.</p>
<input id="income" type="number" placeholder="Monthly income €">
<input id="expenses" type="number" placeholder="Monthly expenses €">
<button onclick="planMoney()">Calculate</button>
<div id="moneyResult" class="result"></div>
</div>

<div class="card">
<h2>📊 Trading Planner</h2>
<p>Use this before making a trade.</p>
<input id="amount" type="number" placeholder="Amount you want to invest €">
<input id="risk" type="number" placeholder="Risk %">
<button onclick="tradePlan()">Calculate Risk</button>
<div id="tradeResult" class="result"></div>
</div>

<div class="card">
<h2>🧮 Tip & Bill Split</h2>
<input id="bill" type="number" placeholder="Bill €">
<input id="people" type="number" placeholder="Number of people">
<input id="tip" type="number" placeholder="Tip %">
<button onclick="splitBill()">Split Bill</button>
<div id="splitResult" class="result"></div>
</div>

<div class="card">
<h2>🚀 Criostoir</h2>
<p>Your simple starting point for money planning and trading education.</p>
<button onclick="alert('Criostoir is ready!')">Start</button>
</div>

</main>

<footer>
Criostoir © 2026
</footer>
