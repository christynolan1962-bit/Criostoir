 
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criostoir Utilities</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f5f9;
  margin: 0;
  padding: 20px;
  color: #222;
}

.container {
  max-width: 500px;
  margin: auto;
}

h1 {
  text-align: center;
  color: #1565c0;
}

.card {
  background: white;
  padding: 20px;
  margin-top: 20px;
  border-radius: 15px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.1);
}

label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  box-sizing: border-box;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 18px;
}

button {
  width: 100%;
  margin-top: 20px;
  padding: 14px;
  background: #1565c0;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 18px;
  font-weight: bold;
}

button:active {
  background: #0d47a1;
}

.result {
  margin-top: 20px;
  padding: 15px;
  background: #e8f1ff;
  border-radius: 10px;
  font-size: 18px;
  line-height: 1.7;
}
</style>
</head>

<body>

<div class="container">

<h1>CRIostoir Utilities</h1>

<div class="card">

<h2>💶 Tip & Bill Split</h2>

<label>Bill Amount (€)</label>
<input type="number" id="bill" placeholder="e.g. 100">

<label>Tip (%)</label>
<input type="number" id="tip" placeholder="e.g. 10">

<label>Number of People</label>
<input type="number" id="people" placeholder="e.g. 2">

<button onclick="calculate()">CALCULATE</button>

<div class="result" id="result">
Enter your details above.
</div>

</div>

</div>

<script>
function calculate() {

  let bill = parseFloat(document.getElementById("bill").value);
  let tip = parseFloat(document.getElementById("tip").value);
  let people = parseInt(document.getElementById("people").value);

  if (!bill || bill <= 0) {
    document.getElementById("result").innerHTML =
      "Please enter the bill amount.";
    return;
  }

  if (isNaN(tip) || tip < 0) {
    tip = 0;
  }

  if (!people || people < 1) {
    people = 1;
  }

  let tipAmount = bill * (tip / 100);
  let total = bill + tipAmount;
  let each = total / people;

  document.getElementById("result").innerHTML =
    "Tip: €" + tipAmount.toFixed(2) +
    "<br>Total: €" + total.toFixed(2) +
    "<br>Each person: €" + each.toFixed(2);
}
</script>

</body>
</html>
